# Build once, then check in parallel: the checks split three ways, the unit tests, and the browser suite split two
# ways — every one of them on its own runner, each restoring the build from the cache rather than making it again. A
# release publishes once the checks and the tests pass.

name: ci

on:
  release:
    types: [published]
  push:
    branches:
      - develop
      - staging
      - main # Change this to your default branch

# A newer push to the same branch makes the run in progress for the older one pointless: it is cancelled. A release
# is never cancelled — it is the one that publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Installs (when the lockfile changed) and builds, once. Every other job restores both from the cache.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          install: 'true'

      # Turbo's own cache, carried from run to run: a package whose inputs did not change is replayed, not rebuilt.
      # Keyed by commit so every run saves what it produced, and restored from the latest — a release reuses what the
      # push of the same commit already did.
      - name: Restore Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ secrets.CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ secrets.CACHE_VERSION }}-

      - name: Restore Cache build
        uses: actions/cache@v6
        with:
          path: '**/dist'
          key: ${{ runner.os }}-build-cache-build-${{ secrets.CACHE_VERSION }}-${{ github.sha }}

      - name: Yarn Build
        run: yarn build:prod && yarn build-vendor:dev && yarn build-vendor:prod

      # An entry nothing has written for a week is dropped before the cache is saved again, so it cannot grow forever.
      # One still in use costs one rebuild a week.
      - name: Prune Cache turbo
        run: find .turbo/cache -type f -mtime +7 -delete || true

  # Lint, style lint and typecheck, split three ways by package: in one job they were the pipeline's longest leg, every
  # package's type-aware lint at once on one runner. Each part is named by what it holds, and the last is "everything
  # else" — written as the others' exclusion, so a package added tomorrow is checked without anybody listing it. The
  # examples are in none: they are written for a person to copy, not part of what the workspace ships.
  #
  # `--only` because these tasks need nothing of each other: without it `dependsOn: ^lint` in turbo.json pulls every
  # dependency's lint into each part, and the shared packages were checked in all three.
  checks:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: builder
            filter: >-
              --filter=@plitzi/plitzi-builder --filter=@plitzi/plitzi-desktop --filter=@plitzi/plitzi-sdk
              --filter=@plitzi/e2e
          - name: platform
            filter: >-
              --filter=@plitzi/sdk-server --filter=@plitzi/sdk-shared --filter=@plitzi/cli --filter=@plitzi/sdk-auth
              --filter=@plitzi/sdk-schema --filter=@plitzi/sdk-interactions
          - name: rest
            filter: >-
              --filter=!@plitzi/plitzi-builder --filter=!@plitzi/plitzi-desktop --filter=!@plitzi/plitzi-sdk
              --filter=!@plitzi/e2e --filter=!@plitzi/sdk-server --filter=!@plitzi/sdk-shared --filter=!@plitzi/cli
              --filter=!@plitzi/sdk-auth --filter=!@plitzi/sdk-schema --filter=!@plitzi/sdk-interactions
              --filter=!./examples/**
    name: checks (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          build: 'true'

      # Turbo's own cache, per part: lint, style lint and typecheck of a package whose inputs did not change are
      # replayed.
      - name: Restore Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-checks-${{ matrix.part.name }}-${{ secrets.CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-checks-${{ matrix.part.name }}-${{ secrets.CACHE_VERSION }}-

      - name: Lint, style lint and typecheck
        run: yarn turbo run lint lint-style typecheck --only ${{ matrix.part.filter }}

      - name: Prune Cache turbo
        run: find .turbo/cache -type f -mtime +7 -delete || true

  # Every package's unit tests, the examples' aside (the root `test` script leaves them out). The integration tests
  # among them skip themselves where there is no database to reach.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          build: 'true'

      - name: Yarn Test
        run: yarn test

  # The browser suite, split two ways by category, the examples' left out — they run on request only. Needs the build —
  # the apps render built output, so an e2e run on an unbuilt tree tests nothing — but not the checks: a formatting
  # complaint says nothing about whether the app works.
  #
  # Split by category rather than `--shard`, because a category starts only the servers it declares (e2e/targets.ts):
  # each runner boots its part of them, not all of them. The parts are e2e/ciParts.ts's. Every server is started by the
  # suite itself, so there is nothing to provision: no database, no hosts file, no certificates. `yarn e2e:ci` says so
  # — the backend is answered in the browser.
  e2e:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Which categories each part runs is e2e/ciParts.ts's: `server` is every category `apps` does not name.
        part: [apps, server]
    name: e2e (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          build: 'true'

      # Keyed on the lockfile, so the download happens again only when the Playwright version moves.
      - name: Restore Cache browsers
        id: cache-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}

      - name: Install browser
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      # A cached browser still needs the system libraries Chromium links against.
      - name: Install browser system dependencies
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      # Each part writes a blob, which `e2e-report` merges into one report; failures are annotated on the run as they
      # happen. Every target that can run without provisioning does, the builder included.
      - name: Yarn E2E
        run: |
          read -ra projects <<< "$(node --import tsx e2e/ciParts.ts ${{ matrix.part }})"
          yarn e2e:ci "${projects[@]}" --reporter=github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/e2e/.artifacts/blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.part }}
          path: e2e/.artifacts/blob
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.part }}
          path: e2e/.artifacts/test-results
          retention-days: 14

  # One report for the two parts. It carries the trace of every failure: open it and step through the run that broke.
  e2e-report:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: e2e/.artifacts/all-blob
          merge-multiple: true

      - name: Merge reports
        run: yarn playwright merge-reports --reporter=html e2e/.artifacts/all-blob
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/.artifacts/report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.artifacts/report
          retention-days: 14

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    # Not `e2e`: it does not run on a release event, and a job that waits on a skipped one never starts.
    needs: [checks, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        registry:
          # - name: github
          #   url: https://npm.pkg.github.com/
          #   token: NPM_AUTH_TOKEN
          #   scope: '@plitzi'
          - name: npm
            url: https://registry.npmjs.org/
            token: NPMJS_TOKEN
            scope: '@plitzi'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-version: ${{ secrets.CACHE_VERSION }}
          build: 'true'
          registry-url: ${{ matrix.registry.url }}

      - name: Yarn Token
        run: |
          yarn config set 'npmRegistryServer' "${{ matrix.registry.url }}"
          yarn config set 'npmAuthToken' "${{ secrets[matrix.registry.token] }}"

      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          createGithubReleases: false
          publish: yarn ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets[matrix.registry.token] }}
          NODE_AUTH_TOKEN: ${{ secrets[matrix.registry.token] }}
          HOME: ${{ github.workspace }}
