<!doctype html>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.plitzi.com" />
    <link rel="preconnect" href="https://server.plitzi.local" />
    <link rel="preconnect" href="https://api.plitzi.local" />
    <link rel="preconnect" href="https://ssr.plitzi.local" />

    <!--
      The import map before anything that loads a module: a browser that fetched one already (a modulepreload counts)
      ignores a map that comes after it, and the SDK's `import "react"` then resolves to nothing.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "<%= react %>",
          "react-dom": "<%= reactDom %>",
          "react-dom/client": "<%= reactDomClient %>",
          "react/jsx-runtime": "<%= reactJsx %>",
          "react/compiler-runtime": "<%= react %>",
          "@plitzi/plitzi-sdk": "<%= jsPath %>"
        }
      }
    </script>

    <link rel="modulepreload" href="<%= react %>" crossorigin />
    <link rel="modulepreload" href="<%= reactDom %>" crossorigin />
    <link rel="modulepreload" href="<%= jsPath %>" />

    <link href="<%= cssPath %>" rel="preload" as="style" />
    <link href="<%= cssPath %>" rel="stylesheet" />
    <link href="<%= iconsCssPath %>" rel="stylesheet" />
  </head>
