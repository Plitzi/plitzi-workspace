# Advisories CI's `audit` job passes over, by id — only one with no fixed release to move to. Each line says the
# package, why it cannot be fixed yet and the date to look again; remove it the day a fix is out.
npmAuditIgnoreAdvisories:
  # picomatch <= 4.0.7 — GHSA-fc5q-39xc-vjpf, a ReDoS on a crafted glob PATTERN. No fixed release exists: 4.0.7 is the
  # latest, and the advisory names none. It is reached here only through build and test tooling (stylelint, vite, rollup, changesets and tinyglobby),
  # whose patterns are a repo's own configuration, never something a visitor sends. Look again on 2026-11-24.
  - '1247710'
